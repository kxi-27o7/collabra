<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Collabra</title>
    <script src="../js/theme.js"></script>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-body">
    <button type="button" class="theme-toggle-btn floating-theme-btn" id="themeToggle" aria-label="Toggle dark mode">
        <span class="theme-icon">☀</span>
    </button>
    <main class="auth-page">
        <section class="auth-card register-layout">
            <div class="auth-visual register-visual">
                <div class="register-tagline">
                    <h2>Structuring the future of academic rigor.</h2>
                </div>
            </div>

            <div class="auth-form-panel">
                <div class="auth-form-wrap register-form-wrap">
                    <h1>Create Account</h1>
                    <p class="auth-subtitle">
                        Create your Collabra account. Your project role will be assigned when you create or join a project.
                    </p>

                    <form id="registerForm" class="form" action="#" method="POST" data-form="register">
                        <div class="form-group">
                            <label for="fullName">Full Name</label>
                            <input
                                type="text"
                                id="fullName"
                                name="full_name"
                                placeholder="Dr. Julianne Smith"
                                autocomplete="name"
                                required
                            >
                            <small class="error-message"></small>
                        </div>

                        <div class="form-group">
                            <label for="registerEmail">Email</label>
                            <input
                                type="email"
                                id="registerEmail"
                                name="email"
                                placeholder="j.smith@university.edu"
                                autocomplete="email"
                                required
                            >
                            <small class="error-message"></small>
                        </div>

                        <div class="form-group">
                            <label for="registerPassword">Password</label>
                            <div class="password-field">
                                <input
                                    type="password"
                                    id="registerPassword"
                                    name="password"
                                    placeholder="••••••••••"
                                    autocomplete="new-password"
                                    required
                                >
                                <button type="button" class="password-toggle" data-toggle-password aria-label="Show password">
                                    ◉
                                </button>
                            </div>
                            <small class="error-message"></small>
                        </div>

                        <label class="checkbox-row terms-row">
                            <input type="checkbox" name="terms" required>
                            <span>
                                I agree to the
                                <a href="#">Terms of Service</a>
                                and
                                <a href="#">Research Privacy Policy</a>.
                            </span>
                        </label>

                        <button type="submit" class="btn btn-primary btn-full">
                            Create Account
                        </button>
                    </form>
                </div>
            </div>
        </section>

        <p class="auth-footer">
            © 2026 Collabra. All rights reserved. Intellectual property of respective institutions.
        </p>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
