<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting - Collabra</title>
    <script>
        const params = new URLSearchParams(window.location.search);
        const taskId = params.get("task_id");
        window.location.replace(
            taskId
                ? "update-task-progress.html?task_id=" + taskId
                : "files.html?tab=tasks"
        );
    </script>
</head>
<body></body>
</html>
